<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>String Methods Project</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="JS/main.js"></script>
  </head>
  <body>
    <div>
      <h1>Concat() Methods</h1>
      <p id="strings"></p>
      <button onclick="concatStrings()">Click here for a sentence</button>
    </div>
    <div>
        <h1>Slice() Methods</h1>
        <p id="slice"></p>
        <button onclick="sliceMethod()">Click here for a sliced sentence</button>   

    </div>
    <div>
        <h1>toUpperCase() Methods</h1>
        <p id="upper"></p>
        <button onclick="upperCaseMethod()">Click here for an upper case sentence</button>  
    </div>        
    <div>
        <h1>search() Methods</h1>
        <p id="search"></p>
        <button onclick="searchMethod()">Click here for search()</button>
    </div>
    <div>
        <h1>Number Methods </h1>    
        <p id="number"></p>
        <button onclick="numberMethod()">Click here</button> 
    </div>
    <div>
        <h1>toPrecision() Method</h1>
        <p id="toPrecision"></p>
        <button onclick="toPrecisionMethod()">Click here</button>   
    </div>   
    <div>
        <h1>toFixed() Method</h1>
        <p id="toFixed"></p>
        <button onclick="toFixedMethod()">Click here</button> 
    </div>
    <div>
        <h1>valueOf() Method</h1>
        <p id="valueOf"></p>
        <button onclick="valueOfMethod()">Click here</button>
    </div>
  </body>
</html>
