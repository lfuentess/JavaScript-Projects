<!DOCTYPE html>
<html lang="en">
<head>
    <title>jQuery Code</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js"></script>
    
    <script>
        // when document is ready call method .append()
        $(document).ready(function() {
            //concatenate a string structure to build HTML
            $("body").append(`
                <div id="container">
                    <div id="inner">
                        <h1>Basic jQuery</h1>
                        <p id="p1">Paragraph 1</p>
                        <p id="p2">Paragraph 2</p>
                        <p id="p3">Paragraph 3</p>
                    </div>
                </div>
            `);

            // Turn Paragraph 2 red
            $("#p2").css({ "color": "red" });

            // Hide the H1 when Paragraph 3 is clicked
            $("#p3").click(function() {
                $("h1").hide();
            });
        });
    </script>
</head>
<body>
    
</body>
</html>
